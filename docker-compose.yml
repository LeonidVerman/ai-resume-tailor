# docker-compose.yml
#
# Current use: LibreOffice headless PDF conversion container.
# Future use:  Full local SaaS stack (backend, frontend, postgres, storage).
#
# Usage:
#   docker-compose up libreoffice   # start LibreOffice converter
#   docker-compose up               # (future) start full dev stack

version: "3.9"

services:

  # ── Existing: LibreOffice PDF conversion ─────────────────────────────────
  libreoffice:
    build:
      context: .
      dockerfile: Dockerfile.libreoffice
    image: ai-resume-tailor-lo
    volumes:
      - ./output:/output
      - type: bind
        source: /mnt/c/Windows/Fonts
        target: /usr/share/fonts/windows
        read_only: true
    profiles:
      - libreoffice

