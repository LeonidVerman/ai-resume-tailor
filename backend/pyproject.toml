[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-tailor-backend"
version = "0.5.0.BETA"
description = "FastAPI backend for ai-resume-tailor SaaS platform"
requires-python = ">=3.11"

# NOTE: This project is not yet implemented (Phase 2+).
# Dependencies listed here are the planned target set.
# Do not install this package yet — the backend source does not exist.
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[asyncio]>=3.1",
    # Validation
    "pydantic>=2.7",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    # HTTP client
    "httpx>=0.27",
    # File uploads
    "python-multipart>=0.0.9",
    # Object storage (S3-compatible)
    "boto3>=1.34",
    # Payments
    "stripe>=9.0",
    # Auth (Supabase + JWT)
    "supabase>=2.0",
    "python-jose[cryptography]>=3.3",
    # PDF/DOCX parsing (shared with generator)
    "python-docx>=1.1",
    "xhtml2pdf>=0.2",
    # HTML parsing (used by job scraper HTTP fallback)
    "beautifulsoup4>=4.12",
    # Browser automation for JS-heavy job pages (HiBob, Wellfound, etc.)
    "playwright>=1.40",
    "playwright-stealth>=1.0.6",
    # Environment
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # for TestClient
]

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
