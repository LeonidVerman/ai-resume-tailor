# backend/alembic.ini
# Run from repo root:  python -m alembic -c backend/alembic.ini <command>
# Or from backend/:    alembic <command>  (if alembic.ini is in cwd)

[alembic]
# Path to the alembic directory (relative to this ini file or repo root)
script_location = backend/alembic

# Database URL is read from environment via env.py — do not hardcode here.
# sqlalchemy.url =

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
