name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── CLI generator tests ─────────────────────────────────────────────────
  test-cli:
    name: CLI Generator Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install CLI dependencies
        run: pip install -e ".[dev]"

      - name: Run CLI tests
        run: python -m pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: "sk-test-placeholder"
          ENABLE_TWO_PHASE: "false"

  # ── Backend tests ───────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tailor
          POSTGRES_PASSWORD: tailor
          POSTGRES_DB: tailor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Install tailor CLI package
        run: pip install -e . --no-deps && pip install openai requests python-dotenv beautifulsoup4 "python-docx>=1.1" "xhtml2pdf>=0.2"

      - name: Install backend dependencies
        run: pip install -e "backend/[dev]"

      - name: Run backend tests
        run: cd backend && python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+psycopg://tailor:tailor@localhost:5432/tailor_test
          APP_ENV: testing
          SECRET_KEY: ci-test-secret
          OPENAI_API_KEY: sk-test-placeholder

  # ── Frontend lint / build ───────────────────────────────────────────────
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # ── Docker builds ───────────────────────────────────────────────────────
  docker-backend:
    name: Docker — Backend
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ai-resume-tailor-backend:ci \
            .

  docker-frontend:
    name: Docker — Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 \
            -t ai-resume-tailor-frontend:ci \
            ./frontend
