[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-tailor"
version = "0.8.1.BETA"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "python-docx",
    "playwright",
    "playwright-stealth>=1.0.6",
    "curl_cffi",
    "xhtml2pdf",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scraping: live network scraping tests (deselect with -m 'not scraping')",
    "network: any test requiring outbound network access",
]

[project.scripts]
tailor = "tailor.cli:main"
pdf-eval = "tailor.eval.__main__:main"
