[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-tailor"
version = "0.1.8.ALPHA"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "python-docx",
    "playwright",
    "xhtml2pdf",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tailor = "tailor.cli:main"
