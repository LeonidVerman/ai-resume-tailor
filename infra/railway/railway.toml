# infra/railway/railway.toml
# Railway deployment configuration for the FastAPI backend.
#
# Deploy backend service on Railway:
#   1. Connect GitHub repo in Railway dashboard
#   2. Set environment variables (see doc/DEPLOYMENT.md)
#   3. Railway will use this file automatically

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
